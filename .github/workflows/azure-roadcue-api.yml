name: Azure - Roadcue API

on:
  pull_request:
    paths:
      - "src/Roadcue.Api/**"
      - "src/Roadcue.Application/**"
      - "src/Roadcue.Domain/**"
      - "src/Roadcue.Infrastructure/**"
      - ".github/workflows/azure-roadcue-api.yml"
      - ".dockerignore"
  push:
    branches: [master]
    paths:
      - "src/Roadcue.Api/**"
      - "src/Roadcue.Application/**"
      - "src/Roadcue.Domain/**"
      - "src/Roadcue.Infrastructure/**"
      - ".github/workflows/azure-roadcue-api.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/Roadcue.Api/Roadcue.Api.csproj
      - run: dotnet build src/Roadcue.Api/Roadcue.Api.csproj --configuration Release --no-restore
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11
      - name: Generate idempotent migration script
        run: |
          mkdir -p artifacts
          dotnet ef migrations script \
            --idempotent \
            --project src/Roadcue.Infrastructure \
            --startup-project src/Roadcue.Api \
            --output artifacts/roadcue-migrations.sql
      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: roadcue-migrations-${{ github.sha }}
          path: artifacts/roadcue-migrations.sql
          retention-days: 30
      - name: Build API container
        run: docker build --file src/Roadcue.Api/Dockerfile --tag roadcue-api:${IMAGE_TAG} .
      - name: Verify API image contract
        run: |
          test -n "$(docker inspect --format '{{.Config.User}}' roadcue-api:${IMAGE_TAG})"
          docker inspect roadcue-api:${IMAGE_TAG} | grep -q '8080/tcp'

  migrate-production:
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-production
    steps:
      - name: Download migration script
        uses: actions/download-artifact@v4
        with:
          name: roadcue-migrations-${{ github.sha }}
          path: artifacts
      - name: Apply migrations to Simply SQL Server
        env:
          SQL_SERVER: ${{ secrets.SIMPLY_SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SIMPLY_SQL_DATABASE }}
          SQL_USER: ${{ secrets.SIMPLY_SQL_USER }}
          SQLCMDPASSWORD: ${{ secrets.SIMPLY_SQL_PASSWORD }}
        run: |
          test -n "$SQL_SERVER"
          test -n "$SQL_DATABASE"
          test -n "$SQL_USER"
          test -n "$SQLCMDPASSWORD"

          docker run --rm \
            -e SQLCMDPASSWORD \
            -v "$PWD/artifacts:/work:ro" \
            mcr.microsoft.com/mssql-tools18 \
            /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -d "$SQL_DATABASE" \
            -U "$SQL_USER" \
            -N \
            -b \
            -i /work/roadcue-migrations.sql

  deploy:
    if: github.event_name != 'pull_request'
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build --file src/Roadcue.Api/Dockerfile --tag "$ACR_NAME.azurecr.io/roadcue-api:$IMAGE_TAG" .
          docker push "$ACR_NAME.azurecr.io/roadcue-api:$IMAGE_TAG"
      - name: Deploy Container App
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_ROADCUE_API_APP_NAME }}
        run: >-
          az containerapp update
          --name "$CONTAINER_APP"
          --resource-group "$RESOURCE_GROUP"
          --image "$ACR_NAME.azurecr.io/roadcue-api:$IMAGE_TAG"
          --min-replicas 1
          --max-replicas 10
