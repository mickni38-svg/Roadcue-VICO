name: Azure - Angular

on:
  pull_request:
    paths:
      - "src/Roadcue.Web/**"
      - ".github/workflows/azure-angular.yml"
  push:
    branches: [master]
    paths:
      - "src/Roadcue.Web/**"
      - ".github/workflows/azure-angular.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Roadcue.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Roadcue.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadcue-angular
          path: src/Roadcue.Web/dist/Roadcue.Web/browser

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roadcue-angular
          path: app
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app
          skip_app_build: true
