name: Azure - Angular

on:
  pull_request:
    paths:
      - "src/Roadcue.Web/**"
      - ".github/workflows/azure-angular.yml"
  push:
    branches: [master]
    paths:
      - "src/Roadcue.Web/**"
      - ".github/workflows/azure-angular.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Roadcue.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Roadcue.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadcue-angular
          path: src/Roadcue.Web/dist/Roadcue.Web/browser

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: azure-production
    env:
      SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roadcue-angular
          path: app

      - uses: azure/login@v2
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inject production Roadcue API URL
        if: github.event_name != 'pull_request'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_ROADCUE_API_APP_NAME }}
        run: |
          FQDN="$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          test -n "$FQDN"
          API_BASE_URL="https://$FQDN"
          echo "Injecting Roadcue API base URL: $API_BASE_URL"

          while IFS= read -r -d '' file; do
            sed -i "s|__ROADCUE_API_BASE_URL__|$API_BASE_URL|g" "$file"
          done < <(find app -type f \( -name '*.js' -o -name '*.html' \) -print0)

          if grep -R "__ROADCUE_API_BASE_URL__" app; then
            echo "Roadcue API placeholder was not fully replaced."
            exit 1
          fi

      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_DEPLOYMENT_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app
          skip_app_build: true

      - name: Skip unconfigured pull-request preview
        if: github.event_name == 'pull_request' && env.SWA_DEPLOYMENT_TOKEN == ''
        run: echo "Static Web Apps preview skipped because the deployment token is not configured."

      - name: Require deployment token outside pull requests
        if: github.event_name != 'pull_request' && env.SWA_DEPLOYMENT_TOKEN == ''
        run: exit 1
