name: Azure - Angular

on:
  pull_request:
    paths:
      - "src/Roadcue.Web/**"
      - ".github/workflows/azure-angular.yml"
  push:
    branches: [master]
    paths:
      - "src/Roadcue.Web/**"
      - ".github/workflows/azure-angular.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Roadcue.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Roadcue.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Generate public runtime configuration
        if: github.event_name != 'pull_request'
        env:
          VICO_BASE_URL: ${{ vars.AZURE_VICO_BASE_URL }}
          ROADCUE_API_BASE_URL: ${{ vars.AZURE_ROADCUE_API_BASE_URL }}
        run: >-
          node -e "const fs=require('fs'); const v=process.env.VICO_BASE_URL.replace(/\/$/, ''); const api=process.env.ROADCUE_API_BASE_URL.replace(/\/$/, ''); fs.writeFileSync('public/runtime-config.js', 'window.__roadcueConfig = '+JSON.stringify({agentChatEndpoint:v+'/agent/chat',roadcueApiBaseUrl:api})+';\n')"
      - run: npm run build
      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadcue-angular
          path: src/Roadcue.Web/dist/Roadcue.Web/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roadcue-angular
          path: app
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app
          skip_app_build: true
