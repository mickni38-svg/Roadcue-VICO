name: Azure - VICO

on:
  pull_request:
    paths:
      - "vico/**"
      - ".github/workflows/azure-vico.yml"
      - ".dockerignore"
  push:
    branches: [master]
    paths:
      - "vico/**"
      - ".github/workflows/azure-vico.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vico
    env:
      OPENAI_API_KEY: test-key-not-used
      ROADCUE_API_BASE_URL: https://roadcue-api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vico/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pytest
      - name: Build VICO container
        working-directory: .
        run: docker build --file vico/Dockerfile --tag roadcue-vico:${IMAGE_TAG} .
      - name: Smoke test VICO container
        working-directory: .
        run: |
          docker run --detach --name roadcue-vico-test --publish 8000:8000 \
            --env OPENAI_API_KEY=test-key-not-used \
            --env ROADCUE_API_BASE_URL=http://roadcue-api \
            roadcue-vico:${IMAGE_TAG}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs roadcue-vico-test
          exit 1
      - name: Stop VICO smoke-test container
        if: always()
        working-directory: .
        run: docker rm --force roadcue-vico-test || true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build --file vico/Dockerfile --tag "$ACR_NAME.azurecr.io/roadcue-vico:$IMAGE_TAG" .
          docker push "$ACR_NAME.azurecr.io/roadcue-vico:$IMAGE_TAG"
      - name: Deploy Container App
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_VICO_APP_NAME }}
          ROADCUE_API_BASE_URL: ${{ vars.ROADCUE_API_BASE_URL }}
        run: |
          if [ -z "$ROADCUE_API_BASE_URL" ]; then
            echo "ROADCUE_API_BASE_URL variable is not configured for this environment." >&2
            exit 1
          fi
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/roadcue-vico:$IMAGE_TAG" \
            --set-env-vars "ROADCUE_API_BASE_URL=$ROADCUE_API_BASE_URL"
